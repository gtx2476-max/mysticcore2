# ---------- Задания и сезонный пропуск ----------
quests:
  timezone-offset-hours: 3     # сдвиг от UTC (3 = Москва) для сброса заданий в полночь
  coin-multiplier: 1.0         # множитель наград монетками
season:
  days: 30
  xp-per-level: 120
  premium-price-tokens: 25000
