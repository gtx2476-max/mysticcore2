  impact-per-item: 0.0015      # на сколько падает цена за каждую проданную штуку
  fee-percent: 0               # налог скупщика, %
  min-multiplier: 0.4
  max-multiplier: 2.2
  prices:                      # базовая цена за 1 шт. в монетках
    COAL: 2
    RAW_COPPER: 2
    COPPER_INGOT: 3
    RAW_IRON: 4
    IRON_INGOT: 6
    RAW_GOLD: 8
    GOLD_INGOT: 12
    REDSTONE: 2
    LAPIS_LAZULI: 3
    QUARTZ: 4
    AMETHYST_SHARD: 5
    DIAMOND: 60
    EMERALD: 40
    ANCIENT_DEBRIS: 120
    NETHERITE_SCRAP: 150
    NETHERITE_INGOT: 800
    DIAMOND_BLOCK: 540
    EMERALD_BLOCK: 360
    OBSIDIAN: 8
    COBBLESTONE: 0.3
    OAK_LOG: 1
    SPRUCE_LOG: 1
    BIRCH_LOG: 1
    JUNGLE_LOG: 1
    ACACIA_LOG: 1
    DARK_OAK_LOG: 1
    WHEAT: 1
    CARROT: 1
    POTATO: 1
    BEETROOT: 1
    SUGAR_CANE: 1
    PUMPKIN: 2
    MELON_SLICE: 0.5
    COCOA_BEANS: 2
    NETHER_WART: 2
    BONE: 1
