# ===== MysticCore config =====
starting-tokens: 1000          # токены новому игроку
survival-world: world          # мир выживания (обычная карта)
lobby-world: mystic_lobby      # мир лобби (создаётся сам, void)

rtp:
  radius: 3000                 # максимальная дальность от спавна
  min-radius: 200
  cooldown-seconds: 30

# ---------- Мистические сундуки (аирдропы) ----------
drops:
  interval-minutes: 3          # раз в сколько минут новая волна
  per-wave: 3                  # сколько сундуков в одной волне (чем больше, тем лучше!)
  min-radius: 300
  max-radius: 3000
  lifetime-after-open-seconds: 300
  only-if-players-online: true
  tier-weights: {poor: 50, solid: 28, rich: 14, elite: 6, crusher: 2}

tiers:                         # price = цена в токенах в обычном магазине сундуков
  poor:
    name: "&7Бедный сундук"
    price: 100
    unlock-seconds: 30
    block: BARREL
    icon: BARREL
  solid:
    name: "&aСолидный сундук"
    price: 500
    unlock-seconds: 40
    block: CHEST
    icon: CHEST
  rich:
    name: "&6Богатый сундук"
    price: 2000
    unlock-seconds: 50
    block: ENDER_CHEST
    icon: ENDER_CHEST
  elite:
    name: "&5Элитный сундук"
    price: 6000
    unlock-seconds: 60
    block: PURPLE_SHULKER_BOX
    icon: PURPLE_SHULKER_BOX
  crusher:
    name: "&c&lСундук Крушителя"
    price: 16500
    unlock-seconds: 75
    block: BEACON
    icon: NETHERITE_BLOCK

# ---------- Донат маркет (ТОКЕНЫ, высокие цены) ----------
market:
  airdrop-prices: {poor: 5000, solid: 15000, rich: 40000, elite: 90000, crusher: 250000}
  sphere-prices: {EMPTY: 10000, FUGU: 60000, POSEIDON: 120000, HADES: 150000, ZEUS: 180000, HERMES: 100000, ATHENA: 110000, ARES: 160000, APOLLO: 130000}

# ---------- Магазин (МОНЕТКИ) ----------
shop:
  sphere-prices: {EMPTY: 600, FUGU: 2500, POSEIDON: 4000, HADES: 4500, ZEUS: 5000, HERMES: 3500, ATHENA: 3800, ARES: 4200, APOLLO: 4000}

# ---------- Чёрный рынок ----------
black-market:
  interval-minutes: 40         # как часто открывается
  duration-minutes: 10         # сколько работает

auction:
  max-lots-per-player: 5

# ---------- Босс Мама Фугу ----------
boss:
  spawn-interval-minutes: 7
  lifetime-minutes: 10
  health: 400
  aura-radius: 7
  beam-damage: 8
  burst-radius: 5
  burst-damage: 6
  fish-reward: 12
  reward-tokens: 500
trade:
  tokens-per-five: 250

mine:
  reset-minutes: 3
  coins-per-ore: 3

rewards:
  tokens-1h: 50
  tokens-3h: 200
  tokens-5h: 400
  coins-per-hour: 100
  daily-tokens: 150
  daily-coins: 300

# ---------- Сферы ----------
head-drop-chance: 100          # % выпадения головы при убийстве игрока игроком
# Текстуры голов: base64 Value ИЛИ 64-символьный хеш с minecraft-heads.com. Пусто = временные головы MHF_*.
textures: {EMPTY: "", FUGU: "", POSEIDON: "", HADES: "", ZEUS: "", HERMES: "", ATHENA: "", ARES: "", APOLLO: ""}

fugu: {radius: 2.0, poison-level: 1, slow-level: 2, armor-bonus: 2}
poseidon: {chance: 40, slow-level: 2, slow-seconds: 4, armor-bonus: 4, health-loss: 4, swim-speed: 1.0}
hades: {chance: 18, require-both-hands: false, fire-seconds: 6, speed-level: 1, armor-loss: 3, damage-bonus: 2, fireball-power: 2, fireball-break-blocks: false}
zeus: {chance: 18, haste-level: 1, armor-loss: 2, attack-speed: 0.4, extra-damage: 6.0, sword-only: false}
hermes: {speed-level: 2, jump-level: 1, health-loss: 6, safe-fall: 8}
athena: {resistance-level: 1, attack-loss: 2, toughness: 4, knockback-resist: 0.4}
ares: {chance: 20, wither-seconds: 3, damage-bonus: 4, attack-speed: 0.3, health-loss: 4}
apollo: {chance: 15, heal: 4, regen-level: 1, luck: 1, attack-loss: 1}

messages:
  no-permission: "&cНет прав."
  reloaded: "&aКонфиг перезагружен."
  given: "&aВыдано: &f{item} &ax{amount} &aигроку &f{player}"
  poseidon-proc: "&b🌊 Враг замедлен!"
  hades-proc: "&c🔥 Фаербол!"
  zeus-proc: "&e⚡ Молния!"
  ares-proc: "&4⚔ Иссушение!"
  apollo-proc: "&6☀ Исцеление!"

